[project]
name = "pymc-nmr"
version = "0.0.1"
authors = [
  { name="John Purton", email="john.purton@stfc.ac.uk" },
]
description = "MC style routines to find configurations to weight calculated NMR"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "ase>=3.26.0",
    "dftd3>=1.2.1",
    "janus-core>=0.8.3",
    "jupyter>=1.1.1",
    "mace>=1.1.2",
    "mace-torch>=0.3.14",
    "numpy>=2.2.6",
    "pytest>=8.4.1",
    "sphinx>=8.1.3",
    "torch>=2.8.0",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://gitlab.stfc.ac.uk/jap93/pymc-nmr"
Issues = "https://gitlab.stfc.ac.uk/jap93/pymc-nmr/-/issues"

[build-system]
requires = ["uv_build >= 0.7.19, <0.9.0"]
build-backend = "uv_build"


[tool.uv]
package = true

