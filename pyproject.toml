[project]
name = "pymc-nmr"
version = "0.0.1"
authors = [
  { name="John Purton", email="john.purton@stfc.ac.uk" },
]
description = "MC style routines to find configurations to weight calculated NMR"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "ase>=3.26.0",
    "dftd3>=1.2.1",
    "janus-core>=0.8.3",
    "mace>=1.1.2",
    "mace-torch>=0.3.14",
    "numpy>=2.2.6",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "torch>=2.8.0",
    "typer>=0.12",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.scripts]
pymc-nmr = "pymc_nmr.monte:app"

[project.urls]
Homepage = "https://github.com/CCP-NC/pymc-nmr"
Issues = "https://github.com/CCP-NC/pymc-nmr/issues"

[build-system]
requires = ["uv_build >= 0.7.19, <0.9.0"]
build-backend = "uv_build"


[tool.uv]
package = true

[project.optional-dependencies]
test = [
    "pytest>=8.4.0",
]
docs = [
    "sphinx>=8.1.3",
]
# Needed only to run the tutorial notebooks in example/.
# soprano, scipy and weas-widget are used by example/CHA/gen_initial_CHA.ipynb
# to build and view the starting structures.
notebooks = [
    "jupyter>=1.1.1",
    "scipy>=1.11",
    "soprano>=0.11",
    "weas-widget>=0.2",
]
# MPI support is optional: pymc-nmr runs serially without it.
mpi = [
    "mpi4py>=3.1",
]

[tool.pytest.ini_options]
# Configuration for [pytest](https://docs.pytest.org)
python_files = "test_*.py"
